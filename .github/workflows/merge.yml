name: merge
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, such as '["tug"]'
        type: string
        default: '"ubuntu-latest"'
      review:
        description: The review output of review.yml in the same run
        type: string
        required: true
jobs:
  merge:
    name: squash or hold
    # A fork's pull request gets no secrets, OIDC token or write token, so Tug skips it and a person handles it.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      statuses: read
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Tug runs from its source, which Node runs as is: no build, and only its runtime dependency to install.
      - name: Get Tug
        run: |
          mkdir "$RUNNER_TEMP/tug"
          curl -fsSL https://codeload.github.com/hellogafaro/tug/tar.gz/main | tar -xz --strip-components=1 -C "$RUNNER_TEMP/tug"
          npm ci --prefix "$RUNNER_TEMP/tug" --omit=dev --ignore-scripts --no-audit --no-fund --no-update-notifier
      - run: node "$RUNNER_TEMP/tug/src/bin.ts" merge "$GITHUB_REPOSITORY#$PR"
        env:
          PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          TUG_REVIEW: ${{ inputs.review }}
          TUG_BASE: ${{ github.event.pull_request.base.ref }}

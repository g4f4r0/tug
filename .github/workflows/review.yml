name: review
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, such as '["tug"]'
        type: string
        default: '"ubuntu-latest"'
    outputs:
      review:
        description: The review as JSON, for merge.yml
        value: ${{ jobs.review.outputs.review }}
    secrets:
      TUG_OPENAI_API_KEY:
        required: false
      TUG_OPENAI_BASE_URL:
        required: false
      TUG_ANTHROPIC_API_KEY:
        required: false
      TUG_ANTHROPIC_BASE_URL:
        required: false
      TUG_REVIEW_MODEL:
        required: false
      TUG_REVIEW_REASONING_EFFORT:
        required: false
      TUG_SECURITY_MODEL:
        required: false
      TUG_SECURITY_REASONING_EFFORT:
        required: false
jobs:
  review:
    name: code and security
    # A fork's pull request gets no secrets, OIDC token or write token, so Tug skips it and a person handles it.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 35
    outputs:
      review: ${{ steps.review.outputs.review }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Tug runs from its source, which Node runs as is: no build, and only its runtime dependency to install.
      - name: Get Tug
        run: |
          mkdir "$RUNNER_TEMP/tug"
          curl -fsSL --retry 3 https://codeload.github.com/g4f4r0/tug/tar.gz/main | tar -xz --strip-components=1 -C "$RUNNER_TEMP/tug"
          npm ci --prefix "$RUNNER_TEMP/tug" --omit=dev --ignore-scripts --no-audit --no-fund --no-update-notifier
      # On a runner with a Tug key service (TUG_KEYS), the job's OIDC token stands in for the provider settings.
      - id: review
        run: node "$RUNNER_TEMP/tug/src/bin.ts" review "$GITHUB_REPOSITORY#$PR"
        env:
          PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          TUG_OPENAI_API_KEY: ${{ secrets.TUG_OPENAI_API_KEY }}
          TUG_OPENAI_BASE_URL: ${{ secrets.TUG_OPENAI_BASE_URL }}
          TUG_ANTHROPIC_API_KEY: ${{ secrets.TUG_ANTHROPIC_API_KEY }}
          TUG_ANTHROPIC_BASE_URL: ${{ secrets.TUG_ANTHROPIC_BASE_URL }}
          TUG_REVIEW_MODEL: ${{ secrets.TUG_REVIEW_MODEL }}
          TUG_REVIEW_REASONING_EFFORT: ${{ secrets.TUG_REVIEW_REASONING_EFFORT }}
          TUG_SECURITY_MODEL: ${{ secrets.TUG_SECURITY_MODEL }}
          TUG_SECURITY_REASONING_EFFORT: ${{ secrets.TUG_SECURITY_REASONING_EFFORT }}
